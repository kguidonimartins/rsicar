name: Live SICAR contract tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Run live contract tests
        env:
          RSICAR_RUN_LIVE_TESTS: 'true'
        run: Rscript --no-init-file -e "devtools::test(filter = 'live')"
